<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="GetV 图标">
    <p class="platform-ios">你可以在“设置”中开启 GetV 的 Safari 扩展。</p>
    <p class="platform-mac state-unknown">你可以在 Safari 的“扩展”偏好设置中开启 GetV。</p>
    <p class="platform-mac state-on">GetV 扩展当前已开启。你可以在 Safari 的“扩展”偏好设置中将其关闭。</p>
    <p class="platform-mac state-off">GetV 扩展当前已关闭。你可以在 Safari 的“扩展”偏好设置中将其开启。</p>
    <button class="platform-mac open-preferences">退出并打开 Safari“扩展”偏好设置…</button>
</body>
</html>
