<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="manager_title">GetV Download Manager</title>
    <link rel="stylesheet" href="manager.css">
    <script src="vendor/mux.js/mux-mp4.min.js"></script>
    <script type="module" src="manager.js"></script>
</head>
<body>
    <header>
        <div class="brand"><span>V</span><div><h1 data-i18n="download_manager">Download Manager</h1><p data-i18n="manager_close_notice">Closing this page pauses segment scheduling; completed segments will not be lost</p></div></div>
        <div class="header-actions">
            <button id="clear-all" class="danger" data-i18n="clear_list">Clear List</button>
            <button id="resume-all" data-i18n="resume_all">Resume All</button>
        </div>
    </header>
    <main>
        <section class="summary">
            <div><small data-i18n="in_progress">In Progress</small><strong id="running-count">0</strong></div>
            <div><small data-i18n="completed">Completed</small><strong id="complete-count">0</strong></div>
            <div><small data-i18n="local_cache">Local Cache</small><strong id="cached-size">0 B</strong></div>
            <label><span data-i18n="concurrency">Concurrency</span><select id="global-concurrency"><option>2</option><option>4</option><option selected>6</option><option>8</option><option>12</option></select></label>
        </section>
        <section id="task-list" class="task-list"></section>
        <section id="empty" class="empty" hidden><div>↓</div><h2 data-i18n="no_download_tasks">No download tasks yet</h2><p data-i18n="no_download_tasks_help">Open GetV from the Safari toolbar and choose a media resource to start downloading.</p></section>
    </main>
    <template id="task-template">
        <article class="task">
            <div class="task-icon">HLS</div>
            <div class="task-body">
                <div class="task-heading"><div><h2></h2><p class="quality"></p></div><span class="status"></span></div>
                <div class="progress"><span></span></div>
                <div class="task-meta"><span class="numbers"></span><span class="speed"></span></div>
                <div class="task-actions"><button data-action="toggle" class="primary"></button><button data-action="partial" data-i18n="save_partial">Save Partial</button><button data-action="rename" data-i18n="rename">Rename</button><button data-action="delete" class="danger" data-i18n="delete_task">Delete Task</button></div>
                <p class="error"></p>
            </div>
        </article>
    </template>
</body>
</html>
